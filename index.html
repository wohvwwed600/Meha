<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B7F70">
<meta name="mobile-web-app-capable" content="yes">
<title>Meha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito','Cairo',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;transition:transform .15s ease,background .25s ease,opacity .25s ease}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{cursor:default}
input[type=text]{font-family:inherit}
label.up:focus-within{outline:3px solid #fff;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tabR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes tabL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes bumpA{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bumpB{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:rotate(-20deg) scale(.4)}60%{transform:rotate(12deg) scale(1.25)}100%{transform:rotate(0) scale(1)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.06,1.12) rotate(1.5deg)}}
@keyframes burstA{0%{transform:scale(.5) rotate(-18deg)}50%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1)}}
@keyframes burstB{0%{transform:scale(.5) rotate(-18deg)}50%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1)}}
@keyframes ringA{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.1);opacity:0}}
@keyframes ringB{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.1);opacity:0}}
@keyframes decoSpin{to{transform:rotate(360deg)}}
@keyframes decoPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.75}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}}
@keyframes decoSpinRev{to{transform:rotate(-360deg)}}
@keyframes particleUp{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(1)}}
@keyframes particleDown{0%{opacity:0;transform:translateY(-10px)}25%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes flameWave{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.88,1.25) skewX(7deg)}60%{transform:scale(1.06,.9) skewX(-6deg)}}
@keyframes zap{0%,100%{opacity:.12}8%{opacity:1}14%{opacity:.2}22%{opacity:1}30%{opacity:.12}}
@keyframes flow{to{stroke-dashoffset:-96}}
@keyframes ripple{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.4)}30%{transform:scale(1)}45%{transform:scale(1.28)}60%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes toastIn{0%{opacity:0;transform:translateY(-22px)}12%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<style>
html,body{height:100%;margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%}
#app>div{width:100% !important;height:100% !important;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="{{dir}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; overflow: hidden; position: relative">
<div style="flex: 1; overflow-y: auto; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0">

<sc-if value="{{ isToday }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px; animation: {{tabAnim}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="min-width: 0">
<div style="font-size: 14px; color: {{c.sub}}; font-weight: 700">{{dateLabel}}</div>
<h1 style="margin: 0; font-size: {{f.h1}}; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{displayName}}</h1>
</div>
<div style="flex: none; background: {{c.accentSoft}}; color: {{c.accentText}}; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: {{f.body}}; animation: {{bump}}">{{points}} {{L.pts}}</div>
</div>

<div style="background: {{c.card}}; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 16px">
<button onClick="{{ openSched }}" aria-label="{{ L.schedule }}" style="position: relative; width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; padding: 0">
<div style="position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #FF8A2B; opacity: 0; animation: {{ringAnim}}"></div>
<div style="animation: {{burstAnim}}">
<svg width="60" height="60" viewBox="0 0 64 64" style="filter: {{flameFilter}}; animation: {{flameLoop}}" aria-hidden="true">
<defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB02E"></stop><stop offset="1" stop-color="#F0432B"></stop></linearGradient></defs>
<path d="M32 3c3 10-8 15-8 28 0 5 3 9 8 9s8-4 8-9c0-4-2-7-2-7 8 5 12 12 12 21a18 18 0 01-36 0C14 33 24 25 28 15c1.5-4 3-8 4-12z" fill="url(#flg)"></path>
<path d="M32 30c1 5-5 7-5 13a5 5 0 0010 0c0-4-3-6-5-13z" fill="#FFE08A"></path>
</svg>
</div>
</button>
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-weight: 800; font-size: 36px; line-height: 1; animation: {{streakNumAnim}}">{{streakNow}}</span>
<span style="font-weight: 800; font-size: {{f.body}}">{{L.streak}}</span>
</div>
<div style="font-size: {{f.small}}; color: {{c.sub}}; margin-top: 4px">{{streakText}}</div>
</div>
</div>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{ weekDots }}" as="w" hint-placeholder-count="7">
<span style="width: 34px; height: 34px; border-radius: 50%; box-sizing: border-box; background: {{w.bg}}; border: 2px solid {{w.border}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ w.lit }}" hint-placeholder-val="{{ false }}"><svg style="animation: pop .4s ease both" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</sc-for>
</div>
</div>

<div style="background: {{c.card}}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-weight: 800; font-size: {{f.h2}}">{{L.challenge}}</div>
<div style="font-size: {{f.small}}; color: {{c.sub}}">{{doneText}}</div>
<div style="height: 12px; border-radius: 999px; background: {{c.accentSoft}}; overflow: hidden"><div style="height: 100%; width: {{progress}}; background: {{c.accent}}; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1)"></div></div>
</div>
<sc-for list="{{ tasks }}" as="t" hint-placeholder-count="5">
<button onClick="{{ t.tap }}" style="display: flex; align-items: center; gap: 14px; text-align: start; background: {{c.card}}; color: {{c.text}}; border: 2px solid {{t.border}}; border-radius: 20px; padding: 16px; min-height: 64px; animation: {{t.anim}}">
<span style="width: 32px; height: 32px; flex: none; border-radius: 50%; border: 2px solid {{c.accent}}; background: {{t.fill}}; transition: background .25s ease; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ t.done }}" hint-placeholder-val="{{ false }}"><svg style="animation: pop .4s ease both" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: {{f.body}}">{{t.title}}</span>
<span style="font-size: {{f.small}}; color: {{c.sub}}">{{t.cat}}</span>
</span>
<span style="font-weight: 800; font-size: {{f.small}}; color: {{c.accentText}}; background: {{c.accentSoft}}; padding: 6px 12px; border-radius: 999px">+{{t.pts}}</span>
</button>
</sc-for>
<button onClick="{{ nextDay }}" style="align-self: center; background: transparent; border: 2px dashed {{c.sub}}; color: {{c.sub}}; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: {{f.small}}; min-height: 44px">{{L.preview}}</button>
</div>
</sc-if>

<sc-if value="{{ isShop }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; animation: {{tabAnim}}">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: {{f.h1}}; font-weight: 800">{{L.medals}}</h1>
<div style="background: {{c.accentSoft}}; color: {{c.accentText}}; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: {{f.body}}; animation: {{bump}}">{{points}} {{L.pts}}</div>
</div>
<div style="display: flex; gap: 6px; background: {{c.card}}; border-radius: 999px; padding: 5px">
<button onClick="{{ goMedals }}" style="flex: 1; min-height: 44px; border: 0; border-radius: 999px; font-weight: 800; font-size: {{f.small}}; background: {{segMBg}}; color: {{segMFg}}">{{L.medals}}</button>
<button onClick="{{ goFrames }}" style="flex: 1; min-height: 44px; border: 0; border-radius: 999px; font-weight: 800; font-size: {{f.small}}; background: {{segFBg}}; color: {{segFFg}}">{{L.frames}}</button>
</div>
<sc-if value="{{ shopMedals }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px; animation: rise .35s ease both">
<div style="background: {{c.card}}; border-radius: 20px; padding: 14px 16px; font-weight: 700; font-size: {{f.small}}; color: {{c.sub}}">{{nextText}}</div>
<sc-for list="{{ medals }}" as="m" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 14px; background: {{c.card}}; border-radius: 22px; padding: 14px 16px">
<div style="width: 64px; flex: none; animation: {{m.anim}}">
<svg width="64" height="80" viewBox="0 0 80 100" style="filter: {{m.filter}}; opacity: {{m.op}}; display: block" aria-hidden="true">
<defs>
<linearGradient id="rim{{m.i}}" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="{{m.hi}}"></stop><stop offset="0.45" stop-color="{{m.mid}}"></stop><stop offset="1" stop-color="{{m.lo}}"></stop></linearGradient>
<radialGradient id="face{{m.i}}" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="{{m.hi}}"></stop><stop offset="0.6" stop-color="{{m.mid}}"></stop><stop offset="1" stop-color="{{m.lo}}"></stop></radialGradient>
</defs>
<polygon points="24,0 41,0 47,40 31,46" fill="{{m.rib}}"></polygon>
<polygon points="56,0 39,0 33,40 49,46" fill="{{m.ribDark}}"></polygon>
<ellipse cx="40" cy="93" rx="22" ry="4" fill="#000" opacity="0.18"></ellipse>
<circle cx="40" cy="62" r="31" fill="url(#rim{{m.i}})"></circle>
<circle cx="40" cy="62" r="26" fill="{{m.lo}}"></circle>
<circle cx="40" cy="62" r="24.5" fill="url(#face{{m.i}})"></circle>
<circle cx="40" cy="62" r="20" fill="none" stroke="{{m.lo}}" stroke-opacity="0.45" stroke-width="1"></circle>
<g transform="translate(40.8,62.8) scale(1.1) translate(-12,-12)"><path d="{{m.icon}}" fill="#000" fill-opacity="0.35"></path></g>
<g transform="translate(40,62) scale(1.1) translate(-12,-12)"><path d="{{m.icon}}" fill="{{m.emb}}" stroke="{{m.lo}}" stroke-opacity="0.6" stroke-width="0.6"></path></g>
<path d="M17 52a26 26 0 0125-17c-12 2-20 9-25 17z" fill="#fff" opacity="0.4"></path>
<circle cx="40" cy="62" r="30.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1"></circle>
</svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 800; font-size: {{f.body}}">{{m.name}}</span>
<span style="font-size: {{f.small}}; color: {{c.sub}}">{{m.motto}}</span>
<span style="font-size: {{f.small}}; font-weight: 800; color: {{c.accentText}}">{{m.cost}} {{L.pts}}</span>
</div>
<button onClick="{{ m.buy }}" disabled="{{ m.off }}" style="flex: none; border: 0; border-radius: 999px; padding: 10px 14px; min-height: 44px; font-weight: 800; font-size: {{f.small}}; background: {{m.btnBg}}; color: {{m.btnFg}}">{{m.label}}</button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ shopFrames }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="fl" hint-placeholder-count="3">
<button onClick="{{ fl.pick }}" style="border: 0; border-radius: 999px; padding: 0 16px; min-height: 44px; font-weight: 800; font-size: {{f.small}}; background: {{fl.bg}}; color: {{fl.fg}}">{{fl.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; animation: rise .35s ease both">
<sc-for list="{{ decos }}" as="d" hint-placeholder-count="8">
<div style="background: {{c.card}}; border-radius: 22px; padding: 18px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="position: relative; width: 64px; height: 64px; margin: 12px 0 10px">
<div style="width: 100%; height: 100%; border-radius: 50%; background: {{d.avBg}}; color: #fff; font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden">{{d.ini}}</div>
<svg width="90" height="90" viewBox="0 0 120 120" style="position: absolute; left: -13px; top: -13px; pointer-events: none; filter: {{d.glow}}" aria-hidden="true">
<defs><linearGradient id="dgT{{d.i}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{d.ga}}"></stop><stop offset="0.5" stop-color="{{d.gb}}"></stop><stop offset="1" stop-color="{{d.gc}}"></stop></linearGradient></defs>
<g style="transform-origin: 60px 60px; transform-box: view-box; animation: {{d.anim}}">
<sc-for list="{{ d.shapes }}" as="q" hint-placeholder-count="2">
<path d="{{q.d}}" fill="{{q.fill}}" stroke="{{q.stroke}}" stroke-width="{{q.sw}}" stroke-dasharray="{{q.dash}}" stroke-linecap="round" opacity="{{q.op}}" style="transform-origin: {{q.origin}}; transform-box: view-box; animation: {{q.anim}}"></path>
</sc-for>
</g>
</svg>
</div>
<span style="font-weight: 800; font-size: {{f.body}}; text-align: center">{{d.name}}</span>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 8px">
<sc-for list="{{ d.swatches }}" as="w2" hint-placeholder-count="4">
<button onClick="{{ w2.pick }}" aria-label="{{ w2.label }}" style="width: 36px; height: 36px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: {{w2.color}}; border: 3px solid {{w2.ring}}; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{w2.mark}}</span></button>
</sc-for>
</div>
<span style="font-size: {{f.small}}; font-weight: 800; color: {{c.accentText}}">{{d.costText}}</span>
<button onClick="{{ d.act }}" disabled="{{ d.off }}" style="border: 0; border-radius: 999px; padding: 0 16px; min-height: 44px; font-weight: 800; font-size: {{f.small}}; background: {{d.btnBg}}; color: {{d.btnFg}}">{{d.label}}</button>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isMe }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; animation: {{tabAnim}}">
<div style="background: {{c.card}}; border-radius: 24px; overflow: hidden">
<div style="height: 128px; background: {{bannerBg}}; position: relative">
<label class="up" style="position: absolute; top: 10px; inset-inline-end: 10px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 999px; padding: 0 14px; height: 40px; box-sizing: border-box; font-weight: 800; font-size: {{f.small}}; display: flex; align-items: center; cursor: pointer; overflow: hidden">{{L.banner}}<input type="file" accept="image/*" onChange="{{onBanner}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer"></label>
</div>
<div style="padding: 0 18px 18px; margin-top: -46px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="position: relative; width: 92px; height: 92px; flex: none">
<div style="width: 100%; height: 100%; border-radius: 50%; border: 4px solid {{c.card}}; box-sizing: border-box; background: {{c.accent}}; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 34px">
<sc-if value="{{ hasPic }}" hint-placeholder-val="{{ false }}"><img src="{{pic}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{ noPic }}" hint-placeholder-val="{{ true }}"><span>{{initial}}</span></sc-if>
</div>
<svg width="128" height="128" viewBox="0 0 120 120" style="position: absolute; left: -18px; top: -18px; pointer-events: none; filter: {{decoGlow}}" aria-hidden="true">
<defs><linearGradient id="dgA0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{decoA}}"></stop><stop offset="0.5" stop-color="{{decoB}}"></stop><stop offset="1" stop-color="{{decoC}}"></stop></linearGradient></defs>
<g style="transform-origin: 60px 60px; transform-box: view-box; animation: {{decoAnim}}">
<sc-for list="{{ decoShapes }}" as="sh" hint-placeholder-count="2">
<path d="{{sh.d}}" fill="{{sh.fill}}" stroke="{{sh.stroke}}" stroke-width="{{sh.sw}}" stroke-dasharray="{{sh.dash}}" stroke-linecap="round" opacity="{{sh.op}}" style="transform-origin: {{sh.origin}}; transform-box: view-box; animation: {{sh.anim}}"></path>
</sc-for>
</g>
</svg>
</div>
<label class="up" style="position: relative; background: {{c.accentSoft}}; color: {{c.accentText}}; border-radius: 999px; padding: 0 16px; height: 44px; box-sizing: border-box; font-weight: 800; font-size: {{f.small}}; display: flex; align-items: center; cursor: pointer; overflow: hidden; margin-bottom: 4px">{{L.photo}}<input type="file" accept="image/*" onChange="{{onPic}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer"></label>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 34px">
<span style="font-weight: 800; font-size: {{f.h2}}">{{displayName}}</span>
<sc-for list="{{ myBadges }}" as="b" hint-placeholder-count="3">
<span role="img" aria-label="{{b.label}}" title="{{b.label}}" style="display: flex; animation: {{b.anim}}">
<svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true" style="display: block">
<defs><linearGradient id="bm{{b.i}}" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="{{b.hi}}"></stop><stop offset="0.5" stop-color="{{b.mid}}"></stop><stop offset="1" stop-color="{{b.lo}}"></stop></linearGradient><radialGradient id="bmf{{b.i}}" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="{{b.hi}}"></stop><stop offset="0.6" stop-color="{{b.mid}}"></stop><stop offset="1" stop-color="{{b.lo}}"></stop></radialGradient></defs>
<polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="url(#bm{{b.i}})"></polygon>
<polygon points="32,7.5 53,19.5 53,44.5 32,56.5 11,44.5 11,19.5" fill="{{b.lo}}"></polygon>
<polygon points="32,9 51.5,20.3 51.5,43.7 32,55 12.5,43.7 12.5,20.3" fill="url(#bmf{{b.i}})"></polygon>
<g transform="translate(32.7,32.7) scale(1.05) translate(-12,-12)"><path d="{{b.icon}}" fill="#000" fill-opacity="0.35"></path></g>
<g transform="translate(32,32) scale(1.05) translate(-12,-12)"><path d="{{b.icon}}" fill="{{b.emb}}" stroke="{{b.lo}}" stroke-opacity="0.6" stroke-width="0.6"></path></g>
<path d="M12.5 28L32 9l19.5 11.3-6 .2C36 20 22 22 12.5 28z" fill="#fff" opacity="0.35"></path>
<polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1"></polygon>
</svg>
</span>
</sc-for>
<sc-if value="{{ noBadges }}" hint-placeholder-val="{{ false }}"><span style="font-size: {{f.small}}; color: {{c.sub}}">{{L.noBadges}}</span></sc-if>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: {{f.small}}; font-weight: 700; color: {{c.sub}}">{{L.name}}
<input type="text" value="{{name}}" onChange="{{onName}}" maxlength="24" placeholder="{{L.namePh}}" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 2px solid {{c.accentSoft}}; background: {{c.bg}}; color: {{c.text}}; padding: 0 14px; font-size: {{f.body}}; font-weight: 800; outline-color: {{c.accent}}">
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
